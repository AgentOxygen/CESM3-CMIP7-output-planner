# Variables added on top of the CMIP7 request when MTt4s is selected: Simone's history additions.
# Hand-maintained; tools/import_cmip7.py checks each name against the MTt4s source catalogue and writes
# the result into data/cmip7_request.yaml.
#
# group  simone-tapes   names Simone's CAM namelist (gen_cam_cmip7_only.py output) puts on a tape after its
#                       "Simone's additions" line: tape, frequency and averaging flag are as written there.
#                       Names with no flag take the tape's default (A).
#        chemistry-only fields Simone requested that the MTso master field list lacks (they only exist with
#                       interactive chemistry). The namelist gives them no tape, so they are ASSUMED monthly
#                       means (assumed: true). Correct the frequency here when it is known.
# freq   a CMIP7 label, or 5day for Simone's h9 tape (nhtfrq = -120; not a CMIP7 frequency).
component: atm      # all are CAM history fields (they come from user_nl_cam); the importer re-checks this
additional:
